<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | The Grind</title>

    <link rel="stylesheet"
          href="css/style.css?v=20261011-credly1">

</head>


<body class="auth-page">


<div class="auth-container">

    <div class="auth-brand">

        <a href="index.html" class="logo">
            <img class="logo-mark" src="assets/grind-logo.png?v=1" alt="">The Grind
        </a>

        <p>
            Start small.<br>
            Stay consistent.
        </p>

    </div>


    <div class="auth-card">

        <div class="auth-heading">

            <h1>Create your account 🌱</h1>

            <p>
                Start your 7-day challenge today.
            </p>

        </div>


        <form id="registerForm">

            <label>Full Name</label>

            <input
                type="text"
                id="registerName"
                placeholder="Your name"
                required
            >


            <label>Email Address</label>

            <input
                type="email"
                id="registerEmail"
                placeholder="you@example.com"
                required
            >


            <label>Password</label>

            <input
                type="password"
                id="registerPassword"
                placeholder="Create a password"
                required
            >


            <label>Confirm Password</label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                required
            >


            <label class="checkbox-label terms">

                <input
                    type="checkbox"
                    required
                >

                I agree to the terms and conditions.

            </label>


            <button
                type="submit"
                class="primary-btn full-btn">

                Create Account

            </button>

        </form>


        <p class="switch-auth">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

</div>


<script src="js/backend-config.js?v=1"></script><script src="js/app.js?v=20261014-backend1"></script>

</body>
</html>
