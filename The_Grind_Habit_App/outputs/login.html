<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | The Grind</title>

    <link rel="stylesheet" href="css/style.css?v=20261011-credly1">
</head>

<body class="auth-page">


<div class="auth-container">

    <div class="auth-brand">

        <a href="index.html" class="logo">
            <img class="logo-mark" src="assets/grind-logo.png?v=1" alt="">The Grind
        </a>

        <p>
            Build better habits,<br>
            one day at a time.
        </p>

    </div>


    <div class="auth-card">

        <div class="auth-heading">

            <h1>Welcome back 👋</h1>

            <p>
                Continue your 7-day journey.
            </p>

        </div>


        <form id="loginForm">

            <label>Email Address</label>

            <input
                type="email"
                id="loginEmail"
                placeholder="you@example.com"
                required
            >


            <label>Password</label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required
            >


            <div class="form-options">

                <label class="checkbox-label">
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#">Forgot password?</a>

            </div>


            <button type="submit" class="primary-btn full-btn">
                Login
            </button>

        </form>


        <div class="auth-divider">
            <span>OR</span>
        </div>


        <p class="switch-auth">

            Don't have an account?

            <a href="register.html">
                Create one
            </a>

        </p>

    </div>

</div>


<script src="js/backend-config.js?v=1"></script><script src="js/app.js?v=20261014-backend1"></script>

</body>
</html>
